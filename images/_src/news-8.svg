<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06121f"/>
      <stop offset="65%" stop-color="#0c2740"/>
      <stop offset="100%" stop-color="#14507f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0%" stop-color="#3b8ada" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3b8ada" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb81c"/>
      <stop offset="100%" stop-color="#ff7a3c"/>
    </linearGradient>
    <linearGradient id="arc2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7db3e8"/>
      <stop offset="100%" stop-color="#1668b4"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- network nodes -->
  <g stroke="#3b8ada" stroke-width="1.6" opacity="0.45" fill="none">
    <path d="M400 250 L196 138M400 250 L604 138M400 250 L196 362M400 250 L604 362M400 250 L400 60M400 250 L400 440"/>
    <path d="M196 138 L604 138M196 362 L604 362M196 138 L196 362M604 138 L604 362"/>
  </g>
  <g fill="#7db3e8" opacity="0.65">
    <circle cx="196" cy="138" r="6"/><circle cx="604" cy="138" r="6"/>
    <circle cx="196" cy="362" r="6"/><circle cx="604" cy="362" r="6"/>
    <circle cx="400" cy="60" r="6"/><circle cx="400" cy="440" r="6"/>
  </g>

  <!-- interlocking arcs: partnership -->
  <path d="M310 250a90 90 0 0 1 180 0" fill="none" stroke="url(#arc1)" stroke-width="16" stroke-linecap="round"/>
  <path d="M490 250a90 90 0 0 1-180 0" fill="none" stroke="url(#arc2)" stroke-width="16" stroke-linecap="round"/>

  <!-- hub -->
  <circle cx="400" cy="250" r="58" fill="#0b1e30" stroke="#3b8ada" stroke-width="3"/>
  <circle cx="400" cy="250" r="40" fill="#14344f"/>
  <path d="M382 250a18 18 0 1 1 12 30" fill="none" stroke="#ffb81c" stroke-width="7" stroke-linecap="round"/>
  <path d="M406 240l12 10-12 10" fill="none" stroke="#ffb81c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="400" cy="250" r="4" fill="#7db3e8"/>

  <!-- data blocks -->
  <g opacity="0.9">
    <rect x="96" y="228" width="56" height="14" rx="7" fill="#1d3a56"/>
    <rect x="648" y="228" width="56" height="14" rx="7" fill="#1d3a56"/>
  </g>
  <circle cx="126" cy="300" r="5" fill="#ffb81c"/>
  <circle cx="676" cy="196" r="5" fill="#7db3e8"/>
</svg>
