<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071a2b"/>
      <stop offset="70%" stop-color="#0d2a45"/>
      <stop offset="100%" stop-color="#16416a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102f4d"/>
      <stop offset="100%" stop-color="#0a1c30"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb81c"/>
      <stop offset="100%" stop-color="#ff8a3c"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- ambient glow -->
  <circle cx="400" cy="250" r="230" fill="#3b8ada" opacity="0.12"/>
  <circle cx="620" cy="90" r="130" fill="#ffb81c" opacity="0.08"/>

  <!-- tablet body -->
  <g transform="rotate(-6 400 250)">
    <rect x="196" y="66" width="420" height="368" rx="24" fill="#0a1c30" stroke="#1d3a56" stroke-width="3"/>
    <rect x="216" y="86" width="380" height="328" rx="12" fill="url(#screen)"/>

    <!-- top bar -->
    <rect x="238" y="108" width="96" height="10" rx="5" fill="#3b8ada" opacity="0.85"/>
    <rect x="238" y="128" width="58" height="8" rx="4" fill="#1d3a56"/>
    <circle cx="566" cy="120" r="12" fill="url(#accent)"/>

    <!-- cards -->
    <g>
      <rect x="238" y="160" width="168" height="88" rx="10" fill="#14344f"/>
      <rect x="258" y="180" width="64" height="9" rx="4.5" fill="#7db3e8" opacity="0.8"/>
      <rect x="258" y="200" width="118" height="7" rx="3.5" fill="#1d3a56"/>
      <rect x="258" y="216" width="92" height="7" rx="3.5" fill="#1d3a56"/>
      <rect x="258" y="228" width="46" height="10" rx="5" fill="#1668b4"/>

      <rect x="424" y="160" width="152" height="88" rx="10" fill="#14344f"/>
      <rect x="444" y="180" width="54" height="9" rx="4.5" fill="#ffb81c" opacity="0.9"/>
      <rect x="444" y="200" width="104" height="7" rx="3.5" fill="#1d3a56"/>
      <rect x="444" y="216" width="78" height="7" rx="3.5" fill="#1d3a56"/>
      <rect x="444" y="228" width="58" height="10" rx="5" fill="#3b8ada"/>
    </g>

    <!-- list rows -->
    <g>
      <rect x="238" y="264" width="338" height="38" rx="9" fill="#14344f"/>
      <circle cx="262" cy="283" r="9" fill="#3b8ada"/>
      <rect x="282" y="276" width="140" height="7" rx="3.5" fill="#2b5375"/>
      <rect x="282" y="288" width="86" height="6" rx="3" fill="#1d3a56"/>
      <rect x="530" y="276" width="28" height="13" rx="6.5" fill="url(#accent)"/>

      <rect x="238" y="310" width="338" height="38" rx="9" fill="#14344f"/>
      <circle cx="262" cy="329" r="9" fill="#1668b4"/>
      <rect x="282" y="322" width="164" height="7" rx="3.5" fill="#2b5375"/>
      <rect x="282" y="334" width="72" height="6" rx="3" fill="#1d3a56"/>
      <rect x="530" y="322" width="28" height="13" rx="6.5" fill="#3b8ada"/>

      <rect x="238" y="356" width="338" height="38" rx="9" fill="#14344f"/>
      <circle cx="262" cy="375" r="9" fill="#ffb81c"/>
      <rect x="282" y="368" width="120" height="7" rx="3.5" fill="#2b5375"/>
      <rect x="282" y="380" width="96" height="6" rx="3" fill="#1d3a56"/>
      <rect x="530" y="368" width="28" height="13" rx="6.5" fill="#7db3e8"/>
    </g>
  </g>

  <!-- floating accent shapes -->
  <circle cx="132" cy="130" r="16" fill="#ffb81c" opacity="0.75"/>
  <rect x="648" y="330" width="34" height="34" rx="9" fill="#3b8ada" opacity="0.55" transform="rotate(18 665 347)"/>
  <circle cx="700" cy="140" r="9" fill="#7db3e8" opacity="0.7"/>
</svg>
