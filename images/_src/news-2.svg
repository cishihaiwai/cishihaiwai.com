<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1c30"/>
      <stop offset="55%" stop-color="#123553"/>
      <stop offset="100%" stop-color="#1b4f76"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123553"/>
      <stop offset="100%" stop-color="#06121f"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1668b4"/>
      <stop offset="100%" stop-color="#0b3f70"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#ffb81c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffb81c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <rect width="800" height="500" fill="url(#glow)"/>
  <circle cx="576" cy="150" r="52" fill="#ffb81c" opacity="0.16"/>
  <circle cx="576" cy="150" r="26" fill="#ffd166" opacity="0.35"/>

  <rect y="288" width="800" height="212" fill="url(#sea)"/>

  <!-- horizon highlight -->
  <rect y="286" width="800" height="3" fill="#3b8ada" opacity="0.5"/>

  <!-- waves -->
  <g stroke="#3b8ada" stroke-width="2" opacity="0.22" fill="none">
    <path d="M0 330q40 -12 80 0t80 0t80 0t80 0t80 0t80 0t80 0t80 0t80 0t80 0"/>
    <path d="M0 366q40 -14 80 0t80 0t80 0t80 0t80 0t80 0t80 0t80 0t80 0t80 0" opacity="0.7"/>
    <path d="M0 408q40 -16 80 0t80 0t80 0t80 0t80 0t80 0t80 0t80 0t80 0t80 0" opacity="0.45"/>
    <path d="M0 452q40 -18 80 0t80 0t80 0t80 0t80 0t80 0t80 0t80 0t80 0t80 0" opacity="0.25"/>
  </g>

  <!-- vessel -->
  <g>
    <path d="M210 300h420l-46 62H256z" fill="url(#hull)"/>
    <path d="M210 300h420l-8 11H218z" fill="#7db3e8" opacity="0.5"/>
    <!-- containers -->
    <g>
      <rect x="286" y="266" width="52" height="34" rx="2" fill="#0e5291"/>
      <rect x="342" y="266" width="52" height="34" rx="2" fill="#1668b4"/>
      <rect x="398" y="266" width="52" height="34" rx="2" fill="#0b3f70"/>
      <rect x="454" y="266" width="52" height="34" rx="2" fill="#ffb81c" opacity="0.85"/>
      <rect x="314" y="228" width="52" height="34" rx="2" fill="#1668b4"/>
      <rect x="370" y="228" width="52" height="34" rx="2" fill="#0e5291"/>
      <rect x="426" y="228" width="52" height="34" rx="2" fill="#0b3f70"/>
    </g>
    <!-- bridge -->
    <rect x="536" y="252" width="58" height="48" rx="3" fill="#e6eef5"/>
    <rect x="546" y="262" width="18" height="12" rx="2" fill="#0e5291"/>
    <rect x="570" y="262" width="18" height="12" rx="2" fill="#0e5291"/>
    <rect x="546" y="280" width="42" height="12" rx="2" fill="#b6c5d3"/>
    <!-- mast -->
    <rect x="561" y="214" width="4" height="38" rx="2" fill="#93a5b6"/>
    <circle cx="563" cy="212" r="4" fill="#ffb81c"/>
    <!-- reflection -->
    <path d="M210 362h420l-46 62H256z" fill="#1668b4" opacity="0.12"/>
  </g>

  <!-- motion streaks -->
  <g stroke="#7db3e8" stroke-linecap="round" opacity="0.35">
    <path d="M60 250h120" stroke-width="3"/>
    <path d="M96 268h74" stroke-width="2"/>
  </g>
</svg>
